# Камера D14 — кабинет с доской в кадре.
#
# Все координаты в пикселях кадра 2560x1440 и получены ИЗ ЗАПИСИ, а не со слов:
# пустая комната в начале файла D14_20260815101759.mp4 (t = 1 с) дала мебель, а
# зоны проверены на ПОЛНОМ проходе детектора по обоим файлам — 43 275 наблюдений
# людей (8 174 + 35 101) при шаге 0.5 с, той же моделью, что и разбор
# (yolo11m-pose, imgsz 1280, conf 0.30). Цифры проверки — в `notes`.
#
# Первая версия этого файла обосновывалась подвыборкой из 128 кадров (911
# наблюдений, 2 % от прохода), и её ДИАПАЗОНЫ были записаны как «за оба файла».
# Медианы подвыборка дала верные, границы — нет: «линия плеч взрослого за своим
# столом y 334..373» на полном проходе оказалась y 300..395. Полный проход лежал
# в .cache/ и стоил ноль секунд. Ниже везде числа полного прохода.
#
# ЗОНА ПРОВЕРЯЕТСЯ ПО ЛИНИИ ПЛЕЧ (`geometry.anchor`), а не по ступням. Это не
# стилистика: см. `notes`, там измерение, из-за которого так.

camera: D14

frame: {width: 2560, height: 1440}

# Сама доска — три зелёные панели. НИКОГДА не проверяется против человека; лежит
# здесь, чтобы `room/layout_io.py` мог отказать в разметке, где `board_zone`
# нарисована полосой пола, и чтобы проверочная картинка рисовала доску.
# Измерено по кадру t = 1 с: левый край 1024, правый 1603, верх 137 (центральная
# панель; левая начинается на 152), низ 313.
board_surface: [[1024, 137], [1603, 137], [1603, 313], [1024, 313]]

# Где оказывается ЛИНИЯ ПЛЕЧ человека, стоящего у доски.
#
# Форма — уголок, а не прямоугольник, и это не украшение: перед ЛЕВЫМ краем
# доски стоит учительский стол, и его нижняя ступенька вырезана.
#
#   верх 140          — верхний край доски (измерено 137). Выше только стена.
#   левый край 1024   — левый край доски.
#   правый край 1645  — доска кончается на 1603, край добавляет 42 px запаса на
#                       человека, стоящего боком у правого края.
#                       ЭТО ЕДИНСТВЕННАЯ ГРАНИЦА В ЭТОМ ФАЙЛЕ, КОТОРУЮ НЕ УДАЛОСЬ
#                       ПРОВЕРИТЬ НЕЗАВИСИМО, и это сказано, а не замолчано.
#                       Независимая метка «человек стоит у доски» здесь одна —
#                       полоса пола, — а она накрывает только x 1100..1330, то
#                       есть центральную панель. У правого края ноги закрыты
#                       партой, и метки нет. Число 1614, стоявшее здесь как
#                       «самая правая линия плеч у доски за оба файла», взято из
#                       подвыборки в 2 % и полным проходом не подтверждается: в
#                       полосе y 140..340 правее 1603 лежит 377 наблюдений
#                       стоящих людей, но стоят ли они У ДОСКИ или у стены за ней,
#                       по этим данным не определить. Считать этот край
#                       измеренным нельзя; он выбран по геометрии доски.
#   низ справа  340   — при x ≥ 1090. Проверено НЕЗАВИСИМО от самой зоны: берём
#                       наблюдения, у которых НИЗ РАМКИ попал в измеренную полосу
#                       пола перед доской (человек стоит на видимом полу прямо
#                       перед центральной панелью) — таких 3 083. Их линия плеч
#                       лежит в y 202..409, медиана 286, 95-й процентиль 323.
#                       Порог 340 принимает 3 030 из них, то есть 98.3 %; 30
#                       отсекает нижним краем и 23 — вырезом слева.
#                       Против чего этот край стоит: наблюдения СИДЯЩИХ за
#                       передней партой у той же стены (лодыжки не видны, рамка
#                       ниже 150 px, x 1090..1645) — их 9 393, и их линия плеч
#                       начинается на 1-м процентиле с 414. То есть зазор между
#                       принятыми и отвергнутыми — 340 против 414, с запасом 74 px.
#                       Ошибка, у которой есть цена, — назвать сидящего «у доски»,
#                       поэтому 340, а не 400: 1.0 % пропущенных стоящих против
#                       нуля пойманных сидящих.
#                       ЧЕГО ЗДЕСЬ НЕТ: утверждения «ниже 331 у доски никого не
#                       бывает». Оно стояло в первой версии этого файла и неверно —
#                       на полном проходе люди, стоящие на полу перед доской,
#                       доходят до y 409. Край 340 — это ВЫБРАННЫЙ РАЗМЕН, а не
#                       граница пустоты.
#   низ слева   265   — при x < 1090, то есть прямо над учительским столом.
#                       Здесь порог другой, потому что здесь стоит стол. В полосе
#                       x 1024..1090 лежит 3 024 наблюдения, и они собраны в две
#                       кучи: y ≤ 239 — 254 наблюдения (взрослый стоит у ЛЕВОГО
#                       КРАЯ ДОСКИ, ноги закрыты его же столом, низ рамки обрезан
#                       на y ≈ 403 — ровно там же, где он же СИДЯ за этим столом);
#                       y ≥ 320 — 2 701 наблюдение (он же за своим столом).
#                       Различает только линия плеч: 239 против 320.
#                       Между кучами 69 наблюдений (2.3 % полосы) — человек в
#                       переходе между столом и доской. 265 делит их 6 / 63.
#                       ЧЕГО ЗДЕСЬ НЕТ: утверждения «в зазоре один артефакт».
#                       Оно стояло в первой версии и неверно: только в y 280..300
#                       лежит 35 наблюдений в 35 РАЗНЫХ моментов времени, с 994 с
#                       по 2 502 с. Зазор разрежен, но не пуст, и на какую сторону
#                       линии попадёт идущий человек — вопрос спорный по существу,
#                       а не вопрос точности разметки.
#
# Проверка на всех 43 275 наблюдениях полного прохода: в зону доски попало
# 5 560. Из них 5 549 — люди с рамкой выше 150 px или с видимыми лодыжками, то
# есть стоящие; 11 (0.20 %) выглядят сидящими и все 11 — обрывки рамок высотой
# 116..146 px, из которых 6 приходятся на моменты, когда у доски кто-то стоял.
# Уголок против прямоугольника без выреза сохраняет 254 верных наблюдения
# (взрослый у левого края доски) и не даёт ни одного ложного.
board_zone: [[1024, 140], [1645, 140], [1645, 340], [1090, 340], [1090, 265], [1024, 265]]

# Стол взрослого — передний левый, с ноутбуком. Проверяется и против ЦЕНТРА МЕСТА
# (медианы линий плеч кластера, `zones.identify_adult`), и против каждого
# наблюдения по отдельности (`metrics/teacher.classify_track` → AT_OWN_DESK).
# Измерено на полном проходе: сюда попадает 3 120 наблюдений (660 из короткого
# файла, 2 460 из длинного), линия плеч x 961..1080 (медиана 1039), y 300..395
# (медиана 341). Ни одно не попадает в `board_zone`, и ни один ученик не попадает
# сюда.
# ВНИМАНИЕ, ЭТОТ КЛАСТЕР ПОДРЕЗАН СВОИМ ЖЕ ПОЛИГОНОМ: медиана (1039, 341)
# устойчива, но диапазоны выше — это границы зоны, а не границы кластера. У края
# y = 300 стоит 20 наблюдений, у y = 395 — шесть, у x = 960 — два, у x = 1085 —
# одно; в двадцатипиксельном ореоле СНАРУЖИ зоны лежит ещё 81 наблюдение, из них
# 40 над верхним краем (y 280..300) и 27 под нижним (y 390..410). Часть времени
# взрослого у собственного стола зона теряет, и это разумно не чинить
# расширением: сверху расширять некуда (там `board_zone` и её вырез, а общая
# точка у двух зон делает разбор недетерминированным), снизу — там уже проход.
# Правый край 1085, а не 1090, и верх 300, а не 265, чтобы у двух зон не было ни
# одной общей точки.
teacher_desk_zone: [[960, 300], [1085, 300], [1085, 395], [960, 395]]

# Дверь в правой стене, видна почти с ребра. Записана, потому что опознаётся;
# ничего её пока не читает. Сколько раз она СРАБАТЫВАЕТ — в `notes`; вопреки
# первой версии этого файла, срабатывает.
door_zone: [[1945, 250], [2040, 250], [2040, 530], [1945, 530]]

excluded_seats: []

# Пусто: полигоны построены по измерениям, но в самой комнате их никто не
# подтверждал. Это не то же самое, что «проверено».
zones_confirmed_by: ""

notes: |
  ГЕОМЕТРИЯ КАМЕРЫ. Камера в задней части класса, смотрит вперёд на доску.
  Парты стоят двумя колонками вдоль стен, поэтому часть учеников сидит боком, а
  часть — лицом к объективу. Взрослый повёрнут к камере и ходит по классу: в
  10:36 он у переднего левого стола с ноутбуком, в 11:01 он сидит СРЕДИ учеников
  за передней правой партой. Из-за этого `identify_adult` по масштабу здесь
  ненадёжен (взрослый бывает ДАЛЬШЕ учеников от объектива), и
  `teacher_desk_zone` — основной путь, а не подстраховка.

  ПРО ЛИЦА — ИЗМЕРЕНО, А НЕ ПРЕДПОЛОЖЕНО. Здесь стояло «ученики сидят СПИНОЙ к
  объективу, лица почти не видны, поэтому опознание по лицу здесь слабее
  измеренных 0.30/0.10». Первая половина неверна: на полном проходе кончик носа
  уверенно (>0.5) находится у 44.1 % наблюдений, глаз — у 46.3 %; на проверочном
  кадре t = 1764 с из шести человек четверо повёрнуты к камере. Вторая половина
  не проверялась вовсе — качество распознавания лиц на этой камере НЕ измерялось,
  а ширина плеч (медиана 63 px, 5-й процентиль 21 px) говорит только о том, что
  лицо у дальних людей занимает единицы пикселей.
  Поэтому здесь не утверждается ни что лица здесь хуже, ни что лучше. Место
  остаётся единственной опорой личности не из-за лиц, а потому что имя в артефакт
  может поставить только подписанный план рассадки (`identity/seatmap.py`), а
  `--faces` выключен по умолчанию и имени не создаёт ни при каких условиях.

  ЗАЧЕМ ЗОНА ПО ПЛЕЧАМ, А НЕ ПО СТУПНЯМ. Сначала была измерена полоса пола перед
  доской — то, на чём человек стоит: [[1105,470],[1330,470],[1310,620],[1100,620]].
  Она работает идеально В ПРОХОДЕ: на полном проходе в неё попадает 3 083
  наблюдения по нижней точке рамки, и НИ ОДНОГО сидящего среди них. Именно
  поэтому она годится как независимая проверка зоны по плечам (см. низ 340) — и
  именно проходом всё и кончается: это середина доски, а оба её края закрыты
  мебелью.
  Правый край закрывает передняя правая парта: у стоящего у
  правого края доски низ рамки обрезается краем парты на y ≈ 443..452, и ровно
  там же оказывается низ рамки СИДЯЩЕГО за этой партой. Различить их по ступне
  нельзя ничем.
  Ровно то же самое происходит у ЛЕВОГО края доски, где ноги закрывает
  учительский стол: взрослый, стоящий у доски (t = 540 с короткого файла), даёт
  низ рамки y ≈ 404 — и он же, сидя за этим столом, даёт y ≈ 403..425. На кадре
  t = 1038 с длинного файла тот же взрослый СТОИТ у доски с низом рамки 449, а на
  t = 1764 с он же СИДИТ среди учеников с низом рамки 451: два пикселя разницы.
  Линия плеч различает: те же два случая дают 214 и 417.
  Поэтому зона по плечам, и поэтому она покрывает всю доску, а не половину.

  ЧЕГО ЭТА РАЗМЕТКА НЕ ДАЁТ. (1) Звука в файлах нет (nb_streams=1), «ответил
  вслух» не измеряется в принципе. (2) Зона проверяется по линии плеч, а линия
  плеч есть не всегда: на полном проходе у 15 наблюдений из 43 275 (0.03 %) плеч
  не нашлось вовсе. Такое наблюдение НЕ проверено ни на одну зону — это не то же
  самое, что «вне зон», и `zonecheck` печатает эти два случая разными словами.
  (3) Кто стоит у доски — ученик или взрослый — зона не говорит и говорить не
  может: на t = 1764 с у доски ученик, на t = 1038 с — и ученик, и взрослый.

  ПРО `door_zone`: ОНА СРАБАТЫВАЕТ, И ПЕРВАЯ ВЕРСИЯ ЭТОГО ФАЙЛА УТВЕРЖДАЛА
  ОБРАТНОЕ. Здесь стояло: «дверь видна с ребра, стена закрывает вошедшего
  примерно на 90 %, у единственного зафиксированного случая (t = 2190 с) модель
  поз вообще не нашла плеч; ноль событий у двери означает „не видно“». Это
  измерено по подвыборке из 128 кадров и на полном проходе не подтверждается:
  в зону двери попадает 25 наблюдений (2 в коротком файле, 23 в длинном), у 24 из
  них уверенность по лодыжкам 0.85..1.00, высота рамки 280..474 px — то есть
  человек виден целиком, а не на 10 %. Есть непрерывная серия из восьми
  наблюдений на t = 1207.4..1210.9 (четыре секунды в дверях) и, вопреки
  утверждению выше, есть плечи на t = 2188.9 и t = 2190.9 — ровно в тот момент,
  который приводился как пример «плеч нет». Подвыборка просто попала на кадр,
  где модель их потеряла.
  Практический вывод не в том, что дверь теперь измеряется, — её по-прежнему
  ничто не читает, — а в том, что фраза «ноль у двери означает „не видно“» была
  бы ложным объяснением нуля. Если дверь когда-нибудь начнут читать, начинать
  надо с этих 25 наблюдений, а не с уверенности, что их нет.

  ЧАСЫ. Наложенная дата стоит на окне с жалюзи, сопоставление глифов
  ОТКАЗЫВАЕТСЯ (запас 0.055/0.038 при пороге 0.07). `video/clock.resolve()`
  берёт время из имени файла и помечает `clock_source: "filename"`.

  НАДПИСЬ «Camera 01» В КАДРЕ НИЧЕГО НЕ ЗНАЧИТ. Она выжжена регистратором и
  стоит одинаково на этой камере и на той, для которой написан camera_01.yaml —
  это разные комнаты. Идентификатор камеры — префикс имени файла (D14).
