# Камера 01 — первый кабинет. ДОСКИ В КАДРЕ НЕТ.
#
# Этот файл существует в паре с camera_d14.yaml. Порознь каждый из них выглядит
# как настройка; вместе они — документ о том, что «у доски» это свойство ПОДВЕСА
# КАМЕРЫ, а не свойство программы. Одна и та же строчка отчёта здесь не может
# быть измерена, а там может, и разница видна только если обе разметки лежат
# рядом.
#
# Координаты в пикселях кадра 2560x1440, взяты из разбора test_camera.mp4
# (out/full_lesson.analysis.json) и из кадра t = 900 с той же записи.

camera: camera_01

frame: {width: 2560, height: 1440}

# Доски в кадре нет — поэтому и `board_surface` нет. Ключ отсутствует, а не
# null: `layout_io` отказывает в разметке, где есть поверхность доски, но нет
# зоны, и здесь нечего описывать.

# NULL, И ЭТО ИЗМЕРЕННЫЙ ФАКТ, А НЕ ПРОПУСК.
#
# Камера висит в углу над доской и смотрит в класс: доска находится ПОД
# объективом и позади него, в кадр не попадает ни одной своей точкой. Ученик,
# вышедший к доске, физически выходит из поля зрения или оказывается у самого
# нижнего края кадра, огромный и в сильном ракурсе, — то есть там же, где
# оказался бы ученик, подошедший к учительскому столу.
#
# Никакой полигон этого не чинит. Поэтому здесь стоит null, `AT_BOARD` не
# производится никогда, выход из-за парты попадает в `AWAY_FROM_PLACE` — это
# правда, просто менее подробная, — а `lesson.unmeasured` артефакта несёт
# строчку «стоял у доски: зона доски не задана для этой камеры».
#
# Ключ обязателен и написан явно: «мы про доску не думали» и «доски в кадре
# нет» — разные утверждения, и `layout_io` не даёт спутать их пропуском ключа.
board_zone: null

# Учительский стол — передний, ближайший к объективу, с ноутбуком и рюкзаком.
# Проверяется против ЦЕНТРА МЕСТА (медианы линий плеч), см. `zones.identify_adult`.
#
# Измерено по out/full_lesson.analysis.json (52 минуты, 9 найденных мест):
#   центр места взрослого        (832, 1295), ширина плеч 214 px
#   ближайшее ученическое место  (1273, 846), ширина плеч 121 px
#   самое нижнее ученическое     (792,  701)
# Между ними ~450 px по вертикали. Границы 1120 сверху и 600..1150 по горизонтали
# стоят в этом зазоре с большим запасом.
#
# Зачем зона, если масштаб и так справился. На этой записи `identify_adult`
# опознал взрослого по масштабу с отношением 2.36 при пороге 1.8 и пометил
# `needs_confirmation: true`. Отношение 2.36 держится только потому, что стол
# взрослого ближе всех к объективу. Стоит камере или столу переехать — а на D14
# это уже случилось, там взрослый бывает ДАЛЬШЕ учеников, — и порог перестаёт
# срабатывать либо срабатывает на ученике первого ряда. Нарисованная зона делает
# ответ `designated` и снимает `needs_confirmation`.
teacher_desk_zone: [[600, 1120], [1150, 1120], [1150, 1440], [600, 1440]]

# Дверь в левой стене; в кадре виден только её край, вошедший появляется уже
# внутри комнаты. Не размечена: полигон, который не покрывает событие входа,
# хуже отсутствующего.
door_zone: null

excluded_seats: []

zones_confirmed_by: ""

notes: |
  ГЕОМЕТРИЯ КАМЕРЫ. Угловая широкоугольная камера, маленький кабинет, шесть
  парт в два ряда. Ученики повёрнуты ЛИЦОМ к объективу (доска и учитель позади
  него) — поэтому `HeadDirection.TOWARD_CAMERA` здесь означает «смотрит вперёд,
  на доску», а `AWAY` — «смотрит назад». На D14 это отображение обратное. Ни
  `geometry.py`, ни `states.py` про это не знают и знать не должны: направление
  трактует тот, кто читает отчёт, и трактовка живёт здесь.

  ЧЕГО ЭТА КАМЕРА НЕ ДАЁТ. (1) «У доски» — не измеряется вообще, см. выше.
  (2) Звука в файле нет, «ответил вслух» не измеряется. Обе строки уходят в
  `lesson.unmeasured` артефакта, а не пропадают молча.

  НАДПИСЬ «Camera 01» В КАДРЕ — это подпись регистратора, и точно такая же
  стоит на записях камеры D14 в другой комнате. Совпадение имени файла и этой
  надписи здесь случайно.
